[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-shared-data"
version = "0.1.5"
description = "Shared data infrastructure for the trading scanner repos: ticker provider, sector lookup, regime detector, signals, data engine."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "yfinance>=0.2.40",
    "requests>=2.31",
    "lxml>=5.0",
    "beautifulsoup4>=4.12",
    "html5lib>=1.1",
    "pyarrow>=14.0",
]

# Only needed to run export_membership_to_csv.py / db.py directly (i.e. to
# refresh data/sp500_membership.csv from Postgres). No runtime consumer of
# this package (data_engine.py included) needs a live DB connection anymore
# — install with: pip install "trading-shared-data[maintenance] @ git+..."
[project.optional-dependencies]
maintenance = [
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
]

[tool.setuptools]
py-modules = [
    "ticker_provider",
    "sector_lookup",
    "regime_detector",
    "signals",
    "data_engine",
    "membership_local",
    "db",
    "options_scanner",
    "options_archive",
]
